[tool:pytest]
minversion = 3.0
addopts = 
    --strict-config
    --strict-markers
    -v
    -ra
    --cov=src/app/
    --cov-config=.coveragerc
    # --cov-report=html
testpaths = ./tests/
filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning
markers = 
    smoke: Run the smoke test test functions
    get: Run the test functions that test tasks.get()
python_classes = 
	- Test*
	- *Suite
python_files =
	- test_*
	- check_*
