[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-station"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
linting = [
    "ruff>=0.11.12",
    "ty>=0.0.1a7",
]
testing = [
    "pytest>=8.3.5",
    "pytest-faker>=2.0.0",
]
dev = [
    {include-group = "linting"},
    {include-group = "testing"},
]
